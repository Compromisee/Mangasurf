[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangasurf"
version = "1.7.3"
description = "Download manga, manhwa and manhua from 30+ sites as CBZ, PDF or EPUB - CLI, menu, TUI, PyQt and GUI reader. HTTP is 100% curl_cffi (TLS/JA3 browser impersonation + async engine)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "Pillow>=10.0",
    "fpdf2>=2.7",
    "EbookLib>=0.18",
    "PyQt6>=6.5.0",
    "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5.0", "pywebview>=5.0"]
tui = ["textual>=0.60"]
tray = ["pystray>=0.19", "Pillow>=10.0"]
server = ["flask>=3.0"]
opds = ["flask>=3.0"]
dev = ["pytest>=7.0"]
all = ["PyQt6>=6.5.0", "pywebview>=5.0", "textual>=0.60", "pystray>=0.19", "flask>=3.0"]

[project.scripts]
mangasurf = "mangasurf.cli:main"
mangasurf-gui = "mangasurf.gui:run_gui"

[tool.setuptools.packages.find]
include = ["mangasurf*"]

[tool.setuptools.package-data]
"mangasurf.reader" = [
    "app/*",
    "app/**/*",
    "foliate/*",
    "foliate/vendor/*",
    "foliate/vendor/pdfjs/*",
    "foliate/vendor/pdfjs/**/*",
    "*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live sites; needs READERM_NETWORK_TESTS=1"]
