<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Near-black minimalist canvas -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <!-- Single restrained accent line -->
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5bbccf"/>
      <stop offset="55%" stop-color="#6fd7e8"/>
      <stop offset="100%" stop-color="#3ba9c0"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" ry="120" fill="url(#bg)"/>
  <rect x="25" y="25" width="462" height="462" rx="119" ry="119"
        fill="none" stroke="#2a2a31" stroke-width="2"/>

  <!-- Minimalist wave: one continuous stroke, thick round caps -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main wave line -->
    <path d="M96 306 C 140 236, 196 236, 244 268
             C 300 306, 356 306, 416 236"
          stroke="url(#line)" stroke-width="34"/>
    <!-- Soft echo beneath, low opacity for depth -->
    <path d="M96 366 C 140 306, 196 306, 244 332
             C 300 362, 356 362, 416 306"
          stroke="#6fd7e8" stroke-width="10" opacity="0.28"/>
  </g>

  <!-- Tiny rising marker dot (reader progress cue) -->
  <circle cx="416" cy="196" r="13" fill="#e8f8fb" opacity="0.9"/>
</svg>
