
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Square Tile (Taskbar Friendly) -->
  <rect width="512" height="512" rx="112" fill="#0D0D14"/>

  <!-- 'M' Wave Crest Shape (White & Pink Gradient) -->
  <!-- Left leg, center dip, and curling wave crest form a distinct 'M' -->
  <path d="M 80,380
           C 90,260 125,200 160,200
           C 185,200 205,250 220,290
           C 240,220 285,130 350,130
           C 310,180 280,210 270,260
           C 250,220 225,180 185,180
           C 150,180 135,250 130,380 Z" fill="#FFFFFF"/>

  <path d="M 220,290
           C 240,220 285,130 350,130
           C 300,140 265,180 250,220
           C 230,270 210,330 180,380
           L 225,380
           C 245,340 260,300 280,270 Z" fill="url(#neonPink)"/>

  <!-- 'S' Surfboard Shape (Neon Cyan Gradient) -->
  <!-- Curving top loop, diagonal board body, and bottom tail wrap to form the 'S' -->
  <path d="M 410,180
           C 340,150 300,200 320,235
           C 335,260 370,270 400,290
           C 440,315 445,360 390,380
           C 320,405 260,370 230,350
           L 245,315
           C 275,340 320,360 370,345
           C 400,335 400,310 380,295
           C 360,280 320,270 295,240
           C 265,205 290,140 370,135
           C 410,130 435,150 450,170 Z" fill="url(#neonCyan)"/>

  <!-- Surfboard Fin Detail (Anchors the 'S' as a surfboard at small scale) -->
  <path d="M 240,360 Q 220,395 200,390 Q 230,370 245,345 Z" fill="url(#neonCyan)"/>
</svg>

