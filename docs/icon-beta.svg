<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- High Contrast Cyberpunk Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FFB199"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A28"/>
      <stop offset="100%" stop-color="#0A0A10"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Tile Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#2A2A40" stroke-width="8"/>

  <!-- Sunburst Focus Element -->
  <circle cx="256" cy="240" r="140" fill="url(#magentaGrad)" opacity="0.15"/>

  <!-- Sharp Manga-Style Main Wave Core -->
  <path d="M 80,410 C 180,410 260,370 320,300 C 370,240 400,160 380,100 C 340,150 290,180 240,200 C 180,224 130,220 80,410 Z" fill="url(#cyanGrad)"/>

  <!-- Dynamic Crest Accent (Surfboard / Forward Motion Arrow Shape) -->
  <path d="M 432,120 C 350,140 290,200 220,270 C 270,245 340,220 400,200 C 420,170 430,140 432,120 Z" fill="#FFFFFF"/>

  <!-- High-Contrast Neon Slash Line -->
  <path d="M 120,400 Q 260,330 420,180" fill="none" stroke="url(#magentaGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Manga Speed Impact Dots (Scaled up for small sizes) -->
  <circle cx="430" cy="140" r="16" fill="#FFFFFF"/>
  <circle cx="455" cy="180" r="10" fill="url(#cyanGrad)"/>
  <circle cx="395" cy="100" r="12" fill="url(#magentaGrad)"/>
</svg>
