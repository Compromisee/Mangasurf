name: Code Formatting & Quality Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  format:
    name: Validate Python & Web Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Syntax Checks
        run: |
          python -m pip install --upgrade pip flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          node -c mangasurf/reader/app/app.js
          node -c mangasurf/reader/app/manga-view.js
          node -c mangasurf/reader/app/themes.js
          node -c mangasurf/reader/app/shelves.js
