name: Release Builds & Multi-Platform OneFile Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.7.1)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release version'
        type: boolean
        default: false
      draft:
        description: 'Create GitHub release as a draft'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip pytest execution phase before building'
        type: boolean
        default: false
      custom_changelog_path:
        description: 'Custom path to parse release notes from'
        required: true
        type: string
        default: 'MD/CHANGELOG.md'
      build_python_version:
        description: 'Python runtime environment version to use'
        required: true
        type: choice
        options:
          - "3.12"
          - "3.11"
          - "3.10"
          - "3.9"
        default: "3.12"
      pyinstaller_log_level:
        description: 'Verbosity log level for PyInstaller compilation'
        required: true
        type: choice
        options:
          - "INFO"
          - "WARN"
          - "ERROR"
          - "DEBUG"
        default: "INFO"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Determine the Dynamic Target Version across all events
  # ──────────────────────────────────────────────────────────────────────────
  prep-version:
    name: Resolve Target Version
    runs-on: ubuntu-latest
    outputs:
      resolved_tag: ${{ steps.get-tag.outputs.tag }}
      clean_version: ${{ steps.get-tag.outputs.clean_version }}
    steps:
      - name: Checkout repository to read project configuration
        uses: actions/checkout@v4

      - name: Resolve Dynamic Version Tag
        id: get-tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          REF_TAG="${{ github.ref_name }}"
          
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TAG" =~ ^v[0-9] ]]; then
            TAG="$REF_TAG"
          else
            EXTRACTED=$(grep -E '^version[[:space:]]*=' pyproject.toml | head -n 1 | tr -d '"' | tr -d "'" | awk '{print $3}')
            if [ -n "$EXTRACTED" ]; then
              TAG="v$EXTRACTED"
            else
              TAG="v0.0.0-snapshot"
            fi
          fi
          
          CLEAN="${TAG#v}"
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN}" >> $GITHUB_OUTPUT
          echo "Resolved dynamic tag: $TAG (Clean version: $CLEAN)"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build Standalone OneFile Binaries across Windows, Linux, and macOS
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build OneFile (${{ matrix.platform.name }})
    needs: prep-version
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows-latest
            artifact_name: mangasurf-windows-x64.exe
            archive_name: mangasurf-${{ needs.prep-version.outputs.resolved_tag }}-windows-x64.zip
            binary_src: dist/Mangasurf.exe
            use_zip: true
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact_name: mangasurf-linux-x86_64
            archive_name: mangasurf-${{ needs.prep-version.outputs.resolved_tag }}-linux-x86_64.tar.gz
            binary_src: dist/Mangasurf
            use_tar: true
          - name: macos-arm64
            os: macos-14
            artifact_name: mangasurf-macos-arm64
            archive_name: mangasurf-${{ needs.prep-version.outputs.resolved_tag }}-macos-arm64.zip
            binary_src: dist/Mangasurf
            use_zip: true
          - name: macos-x86_64
            os: macos-13
            artifact_name: mangasurf-macos-x86_64
            archive_name: mangasurf-${{ needs.prep-version.outputs.resolved_tag }}-macos-x86_64.zip
            binary_src: dist/Mangasurf
            use_zip: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.build_python_version || '3.12' }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libgtk-3-dev \
            gir1.2-webkit2-4.1 \
            libayatana-appindicator3-dev

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run test suite verification before building
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          python -m pytest tests/test_mangasurf_sources.py tests/test_v169_list_downloads.py tests/test_add_v160.py tests/test_fixes_v151.py tests/test_fixes.py -q

      - name: Build Standalone OneFile Executable with PyInstaller
        env:
          PYINSTALLER_ONEFILE: "1"
        run: |
          pyinstaller Mangasurf.spec --clean --noconfirm --log-level=${{ github.event.inputs.pyinstaller_log_level || 'INFO' }} -- --onefile

      - name: Prepare Release Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.platform.binary_src }}" -Destination "${{ matrix.platform.artifact_name }}"
          Compress-Archive -Path "${{ matrix.platform.artifact_name }}", "README.md", "LICENSE", "docs/icon.ico" -DestinationPath "${{ matrix.platform.archive_name }}"
          Get-FileHash "${{ matrix.platform.artifact_name }}" -Algorithm SHA256 | Out-File -FilePath "${{ matrix.platform.artifact_name }}.sha256"
          Get-FileHash "${{ matrix.platform.archive_name }}" -Algorithm SHA256 | Out-File -FilePath "${{ matrix.platform.archive_name }}.sha256"

      - name: Prepare Release Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x "${{ matrix.platform.binary_src }}"
          cp "${{ matrix.platform.binary_src }}" "${{ matrix.platform.artifact_name }}"
          
          if [ "${{ matrix.platform.use_tar }}" = "true" ]; then
            tar -czf "${{ matrix.platform.archive_name }}" "${{ matrix.platform.artifact_name }}" README.md LICENSE docs/icon.png
          else
            zip -r "${{ matrix.platform.archive_name }}" "${{ matrix.platform.artifact_name }}" README.md LICENSE docs/icon.png
          fi
          
          shasum -a 256 "${{ matrix.platform.artifact_name }}" > "${{ matrix.platform.artifact_name }}.sha256"
          shasum -a 256 "${{ matrix.platform.archive_name }}" > "${{ matrix.platform.archive_name }}.sha256"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform.name }}
          path: |
            ${{ matrix.platform.artifact_name }}
            ${{ matrix.platform.archive_name }}
            *.sha256
          if-no-files-found: error
  # ──────────────────────────────────────────────────────────────────────────
  # 3. Extract & Format Release Notes from CHANGELOG.md
  # ──────────────────────────────────────────────────────────────────────────
  release-notes:
    name: Generate Release Notes
    needs: prep-version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ needs.prep-version.outputs.resolved_tag }}
      release_notes: ${{ steps.notes.outputs.content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Formatted Release Notes
        id: notes
        env:
          TAG_NAME: ${{ needs.prep-version.outputs.resolved_tag }}
          CLEAN_VERSION: ${{ needs.prep-version.outputs.clean_version }}
          CHANGELOG_PATH: ${{ github.event.inputs.custom_changelog_path || 'MD/CHANGELOG.md' }}
        shell: bash
        run: |
          # Write the code directly to a script file to avoid Bash quote interpretation issues
          cat << 'EOF' > generate_notes.py
          import os

          tag_name = os.environ.get("TAG_NAME", "v0.0.0")
          clean_ver = os.environ.get("CLEAN_VERSION", "0.0.0")
          changelog = os.environ.get("CHANGELOG_PATH", "MD/CHANGELOG.md")

          notes_body = f"### What's Changed in {tag_name}\n\nAutomated build release for target version {clean_ver}.\nPlease review the full changelog at `{changelog}` for complete details.\n"

          # Write out to GitHub environment step output 
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("content<<EOF\n")
              f.write(notes_body)
              f.write("\nEOF\n")
          EOF

          # Safely execute the generated script file
          python generate_notes.py
  
          if not notes_body:
              notes_body = """### What's Changed
          - **32 Registered Sources**: High-speed scrapers.
          - **Curated List Bulk Downloading**: One-click download for lists.
          - **3D Depth Library Carousel**: Smooth 7-perspective cards with luminous glow, reading progress, and shelf pills.
          - **Offline Database Integration**: Instant omnibar suggestions and offline indexing.
          - **Online reading**: Read on demand online without using storage on your computer
          - **LAN Web Reader & OPDS 1.2 Hub**: Native phone reader server (:8577) & OPDS catalog (:8578) with live device telemetry.
